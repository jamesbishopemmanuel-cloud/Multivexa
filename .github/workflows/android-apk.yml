name: Build Multivexa Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.multivexa --project-name multivexa
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze source (non-blocking during initial setup)
        continue-on-error: true
        run: flutter analyze
      - name: Build universal release APK
        env:
          MULTIVEXA_API_URL: ${{ vars.MULTIVEXA_API_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=MULTIVEXA_API_URL="$MULTIVEXA_API_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: multivexa-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
